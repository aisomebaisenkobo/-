<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会染焙煎工房 コーヒー診断クイズ</title>
<meta name="description" content="長野県池田町の自家焙煎珈琲店「会染焙煎工房」のコーヒー診断クイズ。あなたにぴったりの一杯が見つかります。">
<style>
  :root{
    --bg:#f6efe6;
    --bg2:#efe5d6;
    --paper:#fbf6ee;
    --ink:#3a2a1f;
    --ink-soft:#6b5a4d;
    --accent:#7a4a2b;
    --accent-2:#a3623d;
    --line:#dccab2;
    --shadow:0 8px 24px rgba(80,50,20,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","ヒラギノ角ゴ ProN W3","Yu Gothic","游ゴシック",YuGothic,Meiryo,"メイリオ","Helvetica Neue",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 0%, #f8efe1 0%, transparent 60%),
      radial-gradient(circle at 80% 100%, #ecdcc4 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:24px 18px 60px;
  }
  header.topbar{
    text-align:center;
    margin-bottom:18px;
  }
  .brand{
    font-size:13px;
    letter-spacing:.18em;
    color:var(--ink-soft);
  }
  .title{
    font-size:22px;
    font-weight:700;
    margin:6px 0 4px;
    letter-spacing:.04em;
  }
  .subtitle{
    font-size:13px;
    color:var(--ink-soft);
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 18px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background:linear-gradient(90deg,#a3623d,#7a4a2b,#5e3a26);
  }
  .progress{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .progress span{
    flex:1;
    height:5px;
    background:#e9d9c2;
    border-radius:99px;
    overflow:hidden;
  }
  .progress span.done{background:linear-gradient(90deg,#a3623d,#7a4a2b)}
  .step-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:.05em;
  }
  .question{
    font-size:18px;
    font-weight:700;
    margin:0 0 16px;
    line-height:1.55;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    width:100%;
    text-align:left;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px 14px;
    font:inherit;
    color:var(--ink);
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .opt:hover{
    border-color:var(--accent-2);
    background:#fffaf2;
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(120,70,30,.08);
  }
  .opt:active{transform:translateY(0)}
  .opt .emoji{
    font-size:22px;
    line-height:1;
    flex-shrink:0;
  }
  .opt .lbl{
    font-size:15px;
    line-height:1.5;
  }
  .nav{
    display:flex;
    justify-content:space-between;
    margin-top:14px;
    gap:8px;
  }
  .btn{
    appearance:none;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font:inherit;
    font-size:13px;
    padding:8px 14px;
    border-radius:99px;
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .btn:hover{background:#fdf3e3}
  .btn.primary{
    background:linear-gradient(180deg,#8c5430,#6e4022);
    color:#fff8ec;
    border:none;
    padding:12px 22px;
    font-size:14px;
    letter-spacing:.05em;
    box-shadow:0 6px 16px rgba(110,64,34,.25);
  }
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent}
  .result-head{
    text-align:center;
    margin-bottom:14px;
  }
  .result-tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--accent);
    background:#f4e6d2;
    padding:4px 12px;
    border-radius:99px;
  }
  .result-name{
    font-size:24px;
    font-weight:800;
    margin:10px 0 4px;
    letter-spacing:.02em;
  }
  .result-sub{
    font-size:13px;
    color:var(--ink-soft);
  }
  .result-body{
    background:#fffaf1;
    border:1px dashed var(--line);
    border-radius:12px;
    padding:14px;
    margin:14px 0;
    font-size:14px;
  }
  .meta{
    display:grid;
    grid-template-columns: 90px 1fr;
    gap:8px 12px;
    font-size:13px;
    margin-top:10px;
  }
  .meta dt{
    color:var(--ink-soft);
    font-weight:600;
  }
  .meta dd{margin:0}
  .note{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
    background:#f1e3cd;
    border-left:3px solid var(--accent-2);
    padding:8px 10px;
    border-radius:6px;
    line-height:1.6;
  }
  .tip{
    margin-top:16px;
    background:#fdf3e3;
    border-radius:12px;
    padding:14px;
    border:1px solid var(--line);
  }
  .tip-title{
    font-size:12px;
    letter-spacing:.18em;
    color:var(--accent);
    margin-bottom:6px;
  }
  .tip-body{font-size:14px; line-height:1.7}
  .price-box{
    margin-top:16px;
    border-top:1px solid var(--line);
    padding-top:12px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .actions{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:18px;
    align-items:center;
  }
  footer.bottom{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }
  .bean-emoji{
    font-size:42px;
    text-align:center;
    margin-bottom:4px;
  }
  @media (max-width:380px){
    .title{font-size:20px}
    .question{font-size:16px}
    .opt .lbl{font-size:14px}
    .result-name{font-size:21px}
  }
  /* Fade animation */
  .fade{animation:fade .25s ease}
  @keyframes fade{
    from{opacity:0; transform:translateY(4px)}
    to{opacity:1; transform:translateY(0)}
  }
</style>
</head>

/* ============================
   ステート管理
   ============================ */
const app = document.getElementById("app");
let history = [];
let currentKey = "q1";

function renderQuestion(key){
  const q = QUESTIONS[key];
  const totalSteps = key.startsWith("q2d") || key.startsWith("q3p") ? 2 : 4;
  const stepIndex = ({q1:1,q2:2,q2d:2,q3:3,q3p:3,q4a:4,q4b:4,q4c:4})[key] || 1;
  const totalDisplay = (key==="q2d") ? 2 : (key==="q3p" ? 3 : 4);
  const stepDisplay = (key==="q2d" ? 2 : (key==="q3p" ? 3 : stepIndex));

  const progress = [];
  for(let i=1;i<=totalDisplay;i++){
    progress.push(`<span class="${i<=stepDisplay?'done':''}"></span>`);
  }

  app.innerHTML = `
    <div class="progress">${progress.join("")}</div>
    <div class="step-label">${q.label}</div>
    <h2 class="question">${q.q}</h2>
    <div class="options">
      ${q.options.map((o,i)=>`
        <button class="opt" data-i="${i}">
          <span class="emoji">${o.emoji}</span>
          <span class="lbl">${o.text}</span>
        </button>
      `).join("")}
    </div>
    <div class="nav">
      ${history.length>0?'<button class="btn ghost" id="back">← 1つ戻る</button>':'<span></span>'}
      <button class="btn ghost" id="restart">最初からやり直す</button>
    </div>
  `;
  app.classList.remove("fade"); void app.offsetWidth; app.classList.add("fade");

  app.querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i = +btn.dataset.i;
      const choice = q.options[i];
      history.push(currentKey);
      if(choice.result){
        // ローテーション豆代替がある場合はランダム選択
        let resultKey = choice.result;
        if(choice.alt && Math.random() < 0.45){
          resultKey = choice.alt;
        }
        renderResult(resultKey);
      } else if(choice.next){
        currentKey = choice.next;
        renderQuestion(currentKey);
      }
    });
  });
  const backBtn = document.getElementById("back");
  if(backBtn){
    backBtn.addEventListener("click",()=>{
      const prev = history.pop();
      if(prev){ currentKey = prev; renderQuestion(currentKey); }
    });
  }
  document.getElementById("restart").addEventListener("click", restart);
}

function renderResult(key){
  const c = COFFEES[key];
  if(!c){
    app.innerHTML = `<p>結果が見つかりませんでした。</p>`;
    return;
  }
  const tip = TIPS[Math.floor(Math.random()*TIPS.length)];
  const isProduct = !!c.isProduct;

  app.innerHTML = `
    <div class="result-head">
      <div class="bean-emoji">${c.emoji}</div>
      <span class="result-tag">${c.tag}</span>
      <div class="result-name">${c.name}</div>
      <div class="result-sub">${c.sub}</div>
    </div>
    <div class="result-body">${c.desc}</div>

    <dl class="meta">
      <dt>タイプ</dt><dd>${isProduct?"そのまま楽しめる商品":"豆・粉でのご提供"}</dd>
      ${!isProduct?`<dt>価格</dt><dd>100g 750円〜 / 200g 1,450円〜<br><span style="font-size:12px;color:var(--ink-soft)">※粉でのご注文も可能</span></dd>`:""}
    </dl>

    ${c.rotation ? `<div class="note">※ ローテーション豆のため、時期によってはお取り扱いがない場合があります。店頭でご確認ください。</div>`:""}

    <div class="tip">
      <div class="tip-title">☕️ COFFEE TIP</div>
      <div class="tip-body">${tip}</div>
    </div>

    ${isProduct ? `<div class="price-box">
      ${key==="drip-aizome" ? "ドリップバッグ：1個 150円" : ""}
      ${key==="dip-kansha" ? "DIPバッグ：紐つきバッグタイプ。2番煎じで牛乳に浸せばカフェオレに。" : ""}
      ${key==="icebrew" ? "水出しコーヒー：冷水でじっくり抽出。" : ""}
    </div>` : ""}

    <div class="actions">
      <button class="btn primary" id="restart-big">もう一度診断する</button>
      <button class="btn ghost" id="other-result">他の選択肢も見る</button>
    </div>
  `;
  app.classList.remove("fade"); void app.offsetWidth; app.classList.add("fade");

  document.getElementById("restart-big").addEventListener("click", restart);
  document.getElementById("other-result").addEventListener("click",()=>{
    const prev = history[history.length-1];
    if(prev){ currentKey = prev; renderQuestion(currentKey); }
    else restart();
  });
}

function restart(){
  history = [];
  currentKey = "q1";
  renderQuestion(currentKey);
  window.scrollTo({top:0,behavior:"smooth"});
}

// 初期表示
renderQuestion(currentKey);
</script>
